services:
  kafka-ui:
    restart: unless-stopped
    image: kafbat/kafka-ui:v1.5.0
    environment:
      DYNAMIC_CONFIG_ENABLED: true
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
    volumes:
      - ./dynamic_config.yaml:/etc/kafkaui/dynamic_config.yaml:ro
    labels:
      - traefik.enable=true
      - traefik.http.services.${ENV_NAME:-}-kafka-ui.loadbalancer.server.port=8080
      - traefik.http.routers.${ENV_NAME:-}-kafka-ui.service=${ENV_NAME:-}-kafka-ui
      - traefik.http.routers.${ENV_NAME:-}-kafka-ui.rule=Host(`${APP_HOST:-localhost}`) && PathPrefix(`/kafka-ui`)
      - traefik.http.routers.${ENV_NAME:-}-kafka-ui.middlewares=auth@file
