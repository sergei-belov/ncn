services:
  temporal-schema:
    image: temporalio/admin-tools:1.31.2
    restart: on-failure:6
    env_file: [temporal.env]
    depends_on: { postgres: { condition: service_healthy } }
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    volumes:
      - ./scripts:/scripts:ro

  temporal:
    image: temporalio/server:1.31.2
    restart: unless-stopped
    env_file: [temporal.env]
    environment:
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    depends_on: { temporal-schema: { condition: service_completed_successfully } }
    ports: ["127.0.0.1:7233:7233"]
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.31.2
    restart: on-failure:5
    env_file: [temporal.env]
    depends_on: { temporal: { condition: service_healthy } }
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh
    volumes:
      - ./scripts:/scripts:ro

  temporal-ui:
    image: temporalio/ui:2.52.1
    restart: unless-stopped
    depends_on: { temporal-namespace: { condition: service_completed_successfully } }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: default
      TEMPORAL_UI_PUBLIC_PATH: /temporal
      TEMPORAL_CORS_ORIGINS: http://${APP_HOST:-localhost},https://${APP_HOST:-localhost}
      TEMPORAL_DISABLE_NEWS_FETCH: "true"
      TEMPORAL_DISABLE_WRITE_ACTIONS: "true"
    labels:
      - traefik.enable=true
      - traefik.http.services.${ENV_NAME:-}-temporal-ui.loadbalancer.server.port=8080
      - traefik.http.routers.${ENV_NAME:-}-temporal-ui.service=${ENV_NAME:-}-temporal-ui
      - traefik.http.routers.${ENV_NAME:-}-temporal-ui.rule=Host(`${APP_HOST:-localhost}`) && PathPrefix(`/temporal`)
      - traefik.http.routers.${ENV_NAME:-}-temporal-ui.middlewares=auth@file
